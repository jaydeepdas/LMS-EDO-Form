<!-- =============================================================
     PRODUCT → SUB PRODUCT DEPENDENCY
============================================================== -->

<script>

const mapping = {

    "Home": [
        "Dwelling",
        "Other Structures",
        "Personal Property",
        "Personal Liability",
        "Loss of Use"
    ],

    "Auto": [
        "Collision",
        "Comprehensive",
        "Personal Injury Protection",
        "Uninsured Motorist",
        "Liability"
    ],

    "Renters": [
        "Personal Property",
        "Personal Liability",
        "Loss of Use"
    ],

    "Condo": [
        "Interior Coverage",
        "Loss Assessment",
        "Personal Property",
        "Liability"
    ],

    "General Liability (Commercial)": [
        "Bodily Injury",
        "Property Damage",
        "Personal Injury",
        "Products Liability",
        "Legal Liability"
    ]

};


function updateSubProducts() {

    const product =
        document.getElementById("product").value;

    const subProduct =
        document.getElementById("subProduct");


    /* Reset dropdown */

    subProduct.innerHTML =
        '<option value="">-- Select Sub Product --</option>';


    /* Populate dependent values */

    if (mapping[product]) {

        mapping[product].forEach(item => {

            const option =
                document.createElement("option");

            option.value = item;

            option.textContent = item;

            subProduct.appendChild(option);

        });

    }

}

</script>
